<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1A3867">
  <title>Alianza Tareas</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">A</span>
      <div>
        <strong>Alianza Tareas</strong>
        <small>Coordinación de Proyectos</small>
      </div>
    </div>
    <div class="top-actions">
      <button class="btn btn-gold" id="btnNewTask">+ Nueva tarea</button>
      <button class="icon-btn" id="btnSettings" aria-label="Ajustes">⚙︎</button>
    </div>
  </header>

  <section class="cmdbar" id="cmdbar" aria-label="Barra principal de pendientes"></section>

  <main id="view"></main>

  <nav class="tabbar" id="tabbar">
    <button data-view="hoy" class="active"><span>☀️</span>Hoy</button>
    <button data-view="tablero"><span>▦</span>Tablero</button>
    <button data-view="agencia"><span>✦</span>Oficina</button>
    <button data-view="repo"><span>🗂️</span>Repositorio</button>
    <button data-view="correo"><span>✉️</span>Correo</button>
  </nav>

  <dialog id="taskDialog">
    <form method="dialog" id="taskForm">
      <h2 id="taskDialogTitle">Nueva tarea</h2>
      <label>Título<input name="title" required maxlength="160"></label>
      <label>Proyecto<select name="project"></select></label>
      <div class="row">
        <label>Estado
          <select name="status">
            <option value="todo">Por hacer</option>
            <option value="doing">En curso</option>
            <option value="review">En revisión</option>
            <option value="done">Hecho</option>
          </select>
        </label>
        <label>Prioridad
          <select name="priority">
            <option value="alta">Alta</option>
            <option value="media" selected>Media</option>
            <option value="baja">Baja</option>
          </select>
        </label>
      </div>
      <div class="row">
        <label>Vence<input type="date" name="due"></label>
        <label>Hora<input type="time" name="time"></label>
      </div>
      <label>Responsable<select name="agent"></select></label>
      <label>Recordarme
        <select name="remind">
          <option value="">Sin recordatorio</option>
          <option value="0">A la hora</option>
          <option value="30">30 min antes</option>
          <option value="120">2 horas antes</option>
          <option value="1440">1 día antes</option>
        </select>
      </label>
      <div id="taskSteps" class="task-steps"></div>
      <label>Notas<textarea name="notes" rows="3"></textarea></label>
      <div class="dialog-actions">
        <button type="button" class="btn btn-ghost danger" id="btnDeleteTask" hidden>Eliminar</button>
        <span class="spacer"></span>
        <button type="button" class="btn btn-ghost" id="btnCalTask" hidden>📅 Calendario</button>
        <button value="cancel" class="btn btn-ghost" formnovalidate>Cancelar</button>
        <button value="save" class="btn btn-primary">Guardar</button>
      </div>
    </form>
  </dialog>

  <dialog id="viewDialog" class="view-dialog"></dialog>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="app.js"></script>
</body>
</html>
